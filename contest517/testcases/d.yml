---
type: Batch
timelimit: 4s
match: Lines

cases:
  - name: sample1
    in: |
      3 2 2
      1 3
      1 2
      2 3
    out: "Yes"
  - name: sample2
    in: |
      5 5 4
      2 2 2 2
      1 2
      2 4
      3 5
      4 5
      1 5
    out: "Yes"
  - name: sample3
    in: |
      4 4 2
      1 2
      1 2
      2 3
      3 4
      1 4
    out: "No"

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
